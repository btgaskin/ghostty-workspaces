[package]
name = "ghostty-workspaces"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Native Ghostty workspaces, agent session continuity, and process monitoring"
repository = "https://github.com/btgaskin/ghostty-workspaces"

[[bin]]
name = "gws"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
libc = "0.2"
signal-hook = "0.4"

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
